[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
offline = true
fs_permissions = [{ access = "read", path = "./test/data" }]

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
