[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
offline = true
# the Season 2 byte-for-byte tests render ~200 full cards in one test (tests only; contracts keep their EIP limits)
gas_limit = 9223372036854775807
fs_permissions = [{ access = "read", path = "./test/data" }, { access = "read", path = "./out" }]

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
